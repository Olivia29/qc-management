<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIIA-AI · 质控管理</title>
<style>
:root{
  --navy:#1E3A6F; --blue:#3B82F6; --blue-600:#2563EB; --blue-soft:#E6F0FF;
  --head:#F7F9FC; --line:#E5E7EB; --line2:#D1D5DB;
  --text:#333; --sub:#666; --muted:#999;
  --ok:#18A058; --bad:#D03050; --warn:#D48806;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#F5F6F8;color:var(--text);overflow:hidden;
  display:flex;flex-direction:column;height:100vh;
  font:14px/1.5 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
.mono{font-family:Consolas,"SF Mono",Menlo,monospace;font-size:12px}

/* ---------------- 顶部栏 ---------------- */
.navbar{height:48px;flex:0 0 48px;background:var(--navy);color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 0 0 14px;position:sticky;top:0;z-index:30}
.nb-l{display:flex;align-items:center;gap:9px}
.nb-logo{width:24px;height:24px;border-radius:4px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;letter-spacing:-.4px}
.nb-title{font-size:16px;font-weight:600;letter-spacing:.4px;color:#fff}
.nb-r{display:flex;align-items:center;height:100%}
.nb-org{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
  line-height:1.25;margin-right:16px}
.nb-org span{font-size:12px;color:#fff}
.nb-org small{font-size:10px;color:#CCCCCC}
.wctrl{display:flex;height:100%}
.wctrl button{width:42px;height:100%;background:none;border:none;color:#fff;font-size:13px;
  display:flex;align-items:center;justify-content:center;line-height:1}
.wctrl button:hover{background:rgba(255,255,255,.12)}
.wctrl button.close:hover{background:#E81123}

/* ---------------- Tab 行 ---------------- */
.tabbar{height:48px;flex:0 0 48px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  position:sticky;top:48px;z-index:20}
.tabs{display:flex;align-items:stretch;height:48px}
.tab{display:flex;align-items:center;gap:6px;background:none;border:none;padding:0 16px;
  font-size:14px;color:var(--sub);position:relative;border-radius:0 0 4px 4px}
.tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.tab:hover{color:var(--blue-600)}
.tab.on{background:var(--blue-soft);color:var(--blue-600);font-weight:600}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--blue)}
.tb-acts{display:flex;align-items:center;gap:18px}
.tb-act{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--blue);
  font-size:13px;padding:0}
.tb-act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.tb-act:hover{color:var(--blue-600);text-decoration:underline}

/* ---------------- 表格 ---------------- */
.wrap{padding:14px 16px 18px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.wrap>#tabList,.wrap>#tabImg,.wrap>#tabRep{flex:1;min-height:0;display:flex;flex-direction:column}
.panel{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;
  flex:1;min-height:0;display:flex;flex-direction:column}
.tablewrap{overflow:auto;flex:1;min-height:0;position:relative}
table.qcf{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;min-width:1580px}
.qcf thead th{background:var(--head);color:var(--text);font-weight:600;text-align:left;
  padding:0 10px;height:42px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;z-index:4}
.qcf thead th.ck{width:40px;text-align:center;padding:0}
.qcf thead th.op{text-align:right}
.qcf tbody td{padding:13px 10px;border-bottom:1px solid var(--line);color:var(--text);
  white-space:nowrap;background:#fff;font-size:13.5px}
.qcf tbody td.ck{text-align:center;padding:13px 0}
.qcf tbody tr:hover td{background:#F7F9FC}
.qcf tbody tr.sel td{background:var(--blue-soft)}
.qcf tbody tr:last-child td{border-bottom:none}
.qcf thead tr.qcf-frow th{background:var(--head);padding:0 8px 10px!important;height:54px;
  border-bottom:1px solid var(--line);position:sticky;top:42px;z-index:4}
.qcf thead tr.qcf-frow th.ck{padding:0 0 10px!important}
.qcf-ctl{width:100%;height:32px;border:1px solid var(--line);border-radius:2px;background:#fff;
  font-size:12.5px;color:var(--text);padding:0 8px;outline:none;font-family:inherit}
.qcf-ctl:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,.12)}
.qcf-ctl::placeholder{color:var(--muted)}
select.qcf-ctl{appearance:none;-webkit-appearance:none;padding-right:22px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='6'><path d='M0 0l4 5 4-5z' fill='%23999'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center}
.qcf-date{display:flex;align-items:center;gap:5px}
.qcf-date input{width:calc(50% - 11px);min-width:70px;padding:0 5px}
.qcf-date span{color:var(--muted);font-size:11px}
.qcf-gear{float:right;color:var(--muted);cursor:pointer;font-size:13px;line-height:1.1;font-weight:400}
.qcf-gear:hover{color:var(--blue)}
.qcf .lnk{color:var(--blue);text-decoration:none;cursor:pointer;margin-right:12px;font-size:13px}
.qcf .lnk:hover{text-decoration:underline}
.qcf .lnk.danger{color:var(--bad)}
.qcf .ell{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.qcf .mutd{color:var(--muted)}
.st-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue);cursor:pointer;margin:0}
.or-empty td{text-align:center;color:var(--muted);padding:44px 0!important;background:#fff!important}

/* 表头设置 */
.qcf-menu{position:absolute;top:8px;right:12px;z-index:40;background:#fff;border:1px solid var(--line);
  border-radius:4px;box-shadow:0 6px 20px rgba(30,58,111,.14);padding:8px;min-width:150px}
.qcf-menu label{display:flex;align-items:center;gap:7px;padding:5px 8px;font-size:12.5px;color:var(--text);
  cursor:pointer;border-radius:3px;margin:0}
.qcf-menu label:hover{background:#F7F9FC}
.qcf-menu label.all{border-top:1px solid var(--line);margin-top:5px;padding-top:8px}

/* ---------------- 分页 ---------------- */
.pg{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto;
  padding:10px 14px;border-top:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.pg .info{display:flex;align-items:center;gap:10px}
.pg .info b{font-weight:400;color:var(--text)}
.pg .info .bar{color:var(--line2)}
.pg .info a{color:var(--blue);text-decoration:none;cursor:pointer;font-size:12.5px}
.pg .info a:hover{text-decoration:underline}
.pg .btns{display:flex;align-items:center;gap:6px}
.pg button{min-width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:2px;
  color:var(--text);font-size:12.5px;padding:0 7px}
.pg button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.pg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pg button:disabled{color:var(--line2);cursor:not-allowed}
.pg select{height:28px;border:1px solid var(--line);border-radius:2px;background:#fff;font-size:12.5px;
  color:var(--text);padding:0 6px}
.pg .gap{color:var(--muted);padding:0 2px}
.pg .jump{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12.5px}
.pg .jump input{width:42px;height:28px;border:1px solid var(--line);border-radius:2px;text-align:center;
  font-size:12.5px;font-family:inherit;outline:none;color:var(--text)}
.pg .jump input:focus{border-color:var(--blue)}

/* ===================== 影像质控分析 ===================== */
.qa-title{font-size:18px;font-weight:600;color:var(--text);margin:2px 0 12px}
.qa-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
  border-radius:4px;padding:12px 14px;margin-bottom:12px}
.qa-seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.qa-seg button{background:#fff;border:none;border-right:1px solid var(--line);padding:0 14px;height:30px;
  font-size:13px;color:var(--text)}
.qa-seg button:last-child{border-right:none}
.qa-seg button:hover{color:var(--blue)}
.qa-seg button.on{background:var(--blue);color:#fff}
.qa-seg button.on:hover{color:#fff}
.qa-sel{height:30px;border:1px solid var(--line);border-radius:3px;background:#fff;font-size:13px;
  color:var(--text);padding:0 8px;min-width:88px}
.qa-bar .lbl{font-size:13px;color:var(--sub)}
.qa-range{font-size:12.5px;color:var(--muted)}
.qa-sp{flex:1}
.qa-tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:12px}
.qa-tabs button{background:none;border:none;padding:0 0 9px;font-size:14px;color:var(--sub);position:relative}
.qa-tabs button.on{color:var(--blue-600);font-weight:600}
.qa-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blue)}
.qa-grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:12px;
  align-items:stretch;flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
.qa-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px;
  display:flex;flex-direction:column;min-height:0;height:100%;overflow:hidden}
.qa-grid>.qa-card:nth-child(2){overflow-y:auto}
#qaDetail,#rpDetail{flex:1;min-height:0;overflow-y:auto;padding-right:8px}
#qaDetail::-webkit-scrollbar,#rpDetail::-webkit-scrollbar,
.qa-grid>.qa-card:nth-child(2)::-webkit-scrollbar,
.tablewrap::-webkit-scrollbar{width:8px;height:8px}
#qaDetail::-webkit-scrollbar-thumb,#rpDetail::-webkit-scrollbar-thumb,
.qa-grid>.qa-card:nth-child(2)::-webkit-scrollbar-thumb,
.tablewrap::-webkit-scrollbar-thumb{background:#D6DCE8;border-radius:4px}
#qaDetail::-webkit-scrollbar-thumb:hover,#rpDetail::-webkit-scrollbar-thumb:hover,
.qa-grid>.qa-card:nth-child(2)::-webkit-scrollbar-thumb:hover,
.tablewrap::-webkit-scrollbar-thumb:hover{background:#BFC8D8}
#qaDetail::-webkit-scrollbar-track,#rpDetail::-webkit-scrollbar-track,
.qa-grid>.qa-card:nth-child(2)::-webkit-scrollbar-track,
.tablewrap::-webkit-scrollbar-track{background:transparent}
.qa-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px;flex:0 0 auto}
.qa-kpi{border:1px solid var(--line);border-radius:3px;padding:10px 12px;background:#FCFDFF}
.qa-kpi .lb{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.qa-kpi .vl{font-size:22px;font-weight:600;color:var(--navy);line-height:1.3;margin-top:3px;
  font-variant-numeric:tabular-nums}
.qa-kpi .dt{font-size:11.5px;color:var(--muted);margin-top:1px}
.qa-kpi .dt b{font-weight:600}
.qa-kpi.bad .vl{color:var(--bad)}
.qa-donutrow{display:flex;align-items:center;gap:14px;padding:4px 0 12px;border-bottom:1px dashed var(--line);flex:0 0 auto}
.qa-leg{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--text)}
.qa-leg .r{display:flex;align-items:center;gap:7px}
.qa-leg .r i{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.qa-dt-head{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;flex:0 0 auto;
  font-size:13.5px;font-weight:600;color:var(--text)}
.qa-dt-head i{font-style:normal;color:var(--muted);font-size:11px;transition:transform .2s}
.qa-dt-head.closed i{transform:rotate(-90deg)}
.qa-grp{margin-bottom:12px}
.qa-cap{font-size:12.5px;color:var(--muted);margin-bottom:10px;flex:0 0 auto}
.qa-grp{margin-bottom:14px}
.qa-grp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;
  color:var(--text);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid #F2F4F8}
.qa-grp-h .lt{display:flex;align-items:center;gap:6px;font-weight:600}
.qa-grp-h .lt i{width:7px;height:7px;border-radius:50%}
.qa-grp-h .rt{font-size:12px;color:var(--muted);font-weight:400}
.qa-issue{display:grid;grid-template-columns:1fr 88px 42px 44px;gap:8px;align-items:center;
  font-size:12.5px;color:var(--sub);margin-bottom:9px;padding-left:13px}
.qa-issue .tk{height:6px;border-radius:3px;background:#EDF1F7;overflow:hidden}
.qa-issue .tk i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.qa-issue .num{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.qa-issue .num2{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px}
.qa-row{padding-left:13px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.qa-focus{display:flex;align-items:center;gap:5px;font-size:12px;color:#D4380D;font-weight:400}
.qa-focus i{width:6px;height:6px;border-radius:50%;background:#D4380D}
.qa-donutrow.below{flex-direction:column;align-items:flex-start;gap:9px}
.qa-leg.inline{flex-direction:row;flex-wrap:wrap;gap:6px 14px}
.qa-leg.inline .r{display:flex;align-items:center;gap:5px;font-size:12.5px}
.qa-leg.inline .r i{width:7px;height:7px;border-radius:50%}
.qa-none{font-size:12.5px;color:var(--muted)}
.qa-tag{display:inline-block;margin-left:6px;padding:0 5px;height:16px;line-height:15px;border-radius:2px;
  background:#FFF1F0;color:#D4380D;font-size:10.5px;font-style:normal;border:1px solid #FFCCC7;vertical-align:1px}
.qa-alert{font-style:normal;color:#D4380D;font-weight:600;margin-right:3px}
.qa-card-h{font-size:14px;font-weight:600;color:var(--text);padding-bottom:10px;
  border-bottom:1px solid var(--line);margin-bottom:12px}
.qa-blk{margin-bottom:16px}
.qa-blk:last-child{margin-bottom:0}
.qa-blk-h{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.qa-blk-h::before{content:"";width:3px;height:12px;background:var(--blue);border-radius:2px}
.qa-txt{margin:0 0 8px;font-size:12.5px;line-height:1.75;color:var(--sub);text-align:justify}
.qa-chart{display:block;width:100%;max-width:528px;height:auto;margin:2px auto 0}
.qa-chart text{font-family:inherit;fill:var(--muted);font-size:10px}
.qa-chart .ax{stroke:#EEF1F6}
.qa-chart .vl{fill:var(--text);font-size:11px;font-weight:600}
.qa-keytbl{width:100%;border-collapse:collapse;font-size:13px}
.qa-keytbl th{background:var(--head);text-align:left;font-weight:600;padding:9px 10px;
  border-bottom:1px solid var(--line);color:var(--text);white-space:nowrap}
.qa-keytbl td{padding:10px;border-bottom:1px solid var(--line);color:var(--text)}
.qa-keytbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.qa-empty{padding:50px 0;text-align:center;color:var(--muted);font-size:13px}

/* AI 分析报告弹窗 */
.ai-sheet{width:min(880px,94vw)}
.ai-body{padding:0 20px 4px}
.ai-sec{padding:16px 0;border-bottom:1px solid var(--line)}
.ai-sec:last-of-type{border-bottom:none}
.ai-sec-h{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ai-sec-h span{display:inline-flex;width:20px;height:20px;border-radius:3px;background:var(--blue-soft);
  color:var(--blue-600);font-size:11.5px;align-items:center;justify-content:center}
.ai-h2{font-size:13px;font-weight:600;color:var(--text);margin:12px 0 6px}
.ai-h3{font-size:12.5px;font-weight:600;color:var(--text);margin:9px 0 4px}
.ai-p{margin:0;font-size:12.5px;line-height:1.95;color:var(--sub);text-align:justify}
.ai-data{font-size:12.5px;color:var(--text);background:var(--head);border:1px solid var(--line);
  border-radius:3px;padding:9px 12px}
.ai-radios{display:flex;gap:22px;margin:4px 0 14px}
.ai-radios label{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text);cursor:pointer}
.ai-radios input{width:15px;height:15px;accent-color:var(--blue);cursor:pointer;margin:0}
.ai-foot{display:flex;justify-content:flex-start;padding:0 20px 18px}

/* ---------------- 其它页签占位 ---------------- */
.placeholder{padding:80px 20px;text-align:center;border:1px solid var(--line);border-radius:4px;background:#fff}
.placeholder .ic{width:54px;height:54px;margin:0 auto 14px;border-radius:10px;background:var(--blue-soft);
  display:flex;align-items:center;justify-content:center;color:var(--blue)}
.placeholder .ic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6}
.placeholder b{display:block;font-size:15px;color:var(--text);font-weight:600;margin-bottom:7px}
.placeholder p{margin:0 auto;max-width:540px;font-size:13px;color:var(--sub);line-height:1.75}
.placeholder .tags{margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.placeholder .tags span{font-size:12px;color:#5A6478;background:#F5F7FB;border:1px solid #E8ECF3;
  border-radius:10px;padding:3px 10px}

/* ---------------- 弹窗 ---------------- */
#dgModal{position:fixed;inset:0;background:rgba(20,32,64,.44);display:flex;align-items:center;
  justify-content:center;padding:26px;z-index:60}
.dg-sheet{background:#fff;border-radius:4px;width:min(780px,94vw);max-height:86vh;display:flex;
  flex-direction:column;box-shadow:0 20px 56px rgba(20,32,64,.3);overflow:hidden}
.dg-shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--line);background:var(--head)}
.dg-shead b{font-size:15px;color:var(--navy);font-weight:600}
.dg-shead small{display:block;margin-top:3px;font-size:12px;color:var(--sub)}
.dg-x{background:none;border:none;font-size:12.5px;color:var(--sub)}
.dg-x:hover{color:var(--blue)}
.dg-sbody{padding:16px 18px;overflow:auto}
.dg-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 18px;margin-bottom:14px}
.dg-kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.dg-kv small{font-size:12px;color:var(--muted)}
.dg-kv span{font-size:13px;color:var(--text);word-break:break-all}
.dg-note{background:var(--blue-soft);border:1px solid #CFE1FA;border-radius:3px;padding:9px 11px;
  font-size:12px;color:#2B4C7E;line-height:1.7}
.dg-sfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#FCFDFF}
.btn{background:#fff;border:1px solid var(--line);border-radius:2px;padding:6px 14px;font-size:13px;color:var(--text)}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.05);color:#fff}
.qc-dt{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.qc-dt th{text-align:left;font-weight:600;color:var(--text);padding:8px;background:var(--head);
  border-bottom:1px solid var(--line);white-space:nowrap}
.qc-dt td{padding:8px;border-bottom:1px solid var(--line);color:var(--text);vertical-align:top}

#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(12px);background:rgba(30,58,111,.94);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:3px;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:90;max-width:70vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="navbar">
  <div class="nb-l">
    <span class="nb-logo">YH</span>
    <span class="nb-title">MIIA-AI</span>
  </div>
  <div class="nb-r">
    <div class="nb-org">
      <span>南昌影禾医脉智能科技有限公司</span>
      <small>影像质控中心</small>
    </div>
    <div class="wctrl">
      <button title="最小化" id="winMin">—</button>

<script>
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2000);
}
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function dgOpen(html){
  var m = document.getElementById('dgModal');
  m.innerHTML = html; m.classList.remove('hidden');
  var x = document.getElementById('dgX'); if (x) x.onclick = dgClose;
  var c = document.getElementById('dgClose'); if (c) c.onclick = dgClose;
  m.onclick = function(e){ if (e.target === m) dgClose(); };
}
function dgClose(){ var m = document.getElementById('dgModal'); m.classList.add('hidden'); m.innerHTML = ''; }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') dgClose(); });
</script>

<script>
/* ============================================================================
   质控列表（14 列 + 表头逐列筛选 + 顶部吸附）
   ============================================================================ */
var QC_NAMES = ['黎明','王清','赵敏','孙丽','周强','吴静','郑伟','冯雪','陈曦','褚亮','卫红','蒋文'];
var QC_DEPT  = ['口腔门诊','影像科','放射科','无'];
var QC_PART  = ['胸部','颅脑','腹部'];
var QC_TYPE  = ['CT - 平扫','CT - 增强','MR - 平扫'];
var QC_SCOPE = ['报告','报告+图像','图像'];
var QC_GRADE = [['甲',88],['乙',77],['乙',75],['丙',71],['丙',68],['丁',62]];

var QC2 = (function(){
  var out = [];
  var p2 = function(n){ return (n < 10 ? '0' : '') + n; };
  [
    { name:'黎明', pid:'PAT2026', dept:'口腔门诊', org:'HUAXI', sid:'CN20260734568', sex:'男',
      time:'2026-10-25 10:30:21', type:'CT - 平扫', part:'胸部', scope:'报告', state:'报告：成功',
      sys:'报告：乙 75', tmp:'报告：乙 75' },
    { name:'王清', pid:'PAT2026', dept:'口腔门诊', org:'HUAXI', sid:'CN20260734567', sex:'男',
      time:'2026-10-24 10:30:21', type:'CT - 平扫', part:'胸部', scope:'报告', state:'报告：成功',
      sys:'报告：丙 71', tmp:'报告：丙 71' },
    { name:'HX胸部CT二批次患者0…', pid:'无', dept:'无', org:'huaxi',
      sid:'1.2840.113619.2.476,…', sex:'无', time:'2026-10-19 05:57:00', type:'CT - 平扫',
      part:'胸部', scope:'报告', state:'报告：成功', sys:'报告：乙 77', tmp:'报告：丙 68' }
  ].forEach(function(r, i){ r.idx = i + 1; out.push(r); });

  var base = new Date(2026, 9, 19, 5, 57, 0);
  for (var i = 3; i < 407; i++) {
    var d = new Date(base);
    d.setDate(d.getDate() - i);
    d.setHours((i * 5) % 20 + 1, (i * 17) % 60, (i * 29) % 60);
    var g = QC_GRADE[i % 6], g2 = QC_GRADE[(i + 2) % 6];
    var batch = i % 5 === 0;
    out.push({
      idx: i + 1,
      name: batch ? ('HX胸部CT二批次患者' + p2(i % 100)) : QC_NAMES[i % QC_NAMES.length],
      pid: batch ? '无' : ('PAT20260' + (34500 + i)),
      dept: batch ? '无' : QC_DEPT[i % 4],
      org: batch ? 'huaxi' : 'HUAXI',
      sid: batch ? ('1.2840.113619.2.' + (470 + i) + ',…') : ('CN2026' + (734500 - i) + ''),
      sex: batch ? '无' : (i % 3 === 0 ? '女' : '男'),
      time: d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' '
          + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds()),
      type: QC_TYPE[i % 3],
      part: QC_PART[i % 3],
      scope: QC_SCOPE[i % 3],
      state: i % 23 === 0 ? '报告：质控中' : (i % 17 === 0 ? '报告：失败' : '报告：成功'),
      sys: '报告：' + g[0] + ' ' + (g[1] - (i % 5)),
      tmp: '报告：' + g2[0] + ' ' + (g2[1] - (i % 4))
    });
  }
  return out;
})();

var QC2_COLS = [
  { k:'name',  t:'患者姓名',     w:150, f:'text', sort:true },
  { k:'pid',   t:'患者ID',       w:130, f:'text' },
  { k:'dept',  t:'部门',         w:110, f:'select', opts:['口腔门诊','影像科','放射科','无'] },
  { k:'org',   t:'机构',         w:96,  f:'select', opts:['HUAXI','huaxi'] },
  { k:'sid',   t:'检查号',       w:184, f:'text' },
  { k:'sex',   t:'性别',         w:86,  f:'select', opts:['男','女','无'] },
  { k:'time',  t:'检查日期',     w:168, f:'date', sort:true },
  { k:'type',  t:'检查类型',     w:126, f:'select', opts:['CT - 平扫','CT - 增强','MR - 平扫'] },
  { k:'part',  t:'部位',         w:96,  f:'select', opts:['胸部','颅脑','腹部'] },
  { k:'scope', t:'质控范围',     w:118, f:'select', opts:['报告','报告+图像','图像'] },
  { k:'state', t:'质控状态',     w:130, f:'select', opts:['报告：成功','报告：质控中','报告：失败'], sort:true },
  { k:'sys',   t:'系统质控结果', w:130, f:'select', opts:['甲','乙','丙','丁'] },
  { k:'tmp',   t:'暂存审核结果', w:130, f:'select', opts:['甲','乙','丙','丁'] }
];

var QC2_F = {};
var QC2_S = { page:1, size:50, sort:'time', desc:true, hide:{}, sel:{} };
QC2_COLS.forEach(function(c){ QC2_F[c.k] = (c.f === 'date') ? { from:'', to:'' } : ''; });

function qc2Val(r, k){
  if (k === 'sys' || k === 'tmp') return r[k].replace('报告：', '').split(' ')[0];
  return r[k];
}
function qc2Filtered(){
  return QC2.filter(function(r){
    for (var i = 0; i < QC2_COLS.length; i++) {
      var c = QC2_COLS[i], f = QC2_F[c.k];
      if (c.f === 'date') {
        if (f.from && r.time.slice(0,10) < f.from) return false;
        if (f.to   && r.time.slice(0,10) > f.to)   return false;
      } else if (c.f === 'select') {
        if (f && qc2Val(r, c.k) !== f) return false;
      } else if (c.f === 'text') {
        if (f && String(r[c.k]).toUpperCase().indexOf(f.toUpperCase()) < 0) return false;
      }
    }
    return true;
  });
}
function qc2Ctl(c){
  var id = 'qcf_' + c.k, f = QC2_F[c.k];
  if (c.f === 'date') {
    return '<div class="qcf-date">'
         +   '<input type="date" class="qcf-ctl" id="' + id + '_from" value="' + (f.from || '') + '" title="开始日期">'
         +   '<span>→</span>'
         +   '<input type="date" class="qcf-ctl" id="' + id + '_to" value="' + (f.to || '') + '" title="结束日期">'
         + '</div>';
  }
  if (c.f === 'select') {
    var opts = '<option value="">请选择</option>' + c.opts.map(function(o){
      return '<option' + (f === o ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('');
    return '<select class="qcf-ctl" id="' + id + '">' + opts + '</select>';
  }
  return '<input class="qcf-ctl" id="' + id + '" placeholder="请输入" value="' + esc(f || '') + '">';
}

function renderQc(){
  var rows = qc2Filtered();
  var k = QC2_S.sort, desc = QC2_S.desc;
  rows = rows.slice().sort(function(a, b){
    var x = qc2Val(a, k), y = qc2Val(b, k);
    if (typeof x === 'string') return desc ? y.localeCompare(x) : x.localeCompare(y);
    return desc ? y - x : x - y;
  });

  var cols = QC2_COLS.filter(function(c){ return !QC2_S.hide[c.k]; });
  var maxP = Math.max(1, Math.ceil(rows.length / QC2_S.size));
  if (QC2_S.page > maxP) QC2_S.page = maxP;
  var view = rows.slice((QC2_S.page - 1) * QC2_S.size, QC2_S.page * QC2_S.size);
  var arrow = function(c2){ return c2.sort ? (QC2_S.sort === c2.k ? (QC2_S.desc ? ' ▾' : ' ▴') : ' ◇') : ''; };

  var h = '<colgroup><col style="width:40px">'
        + cols.map(function(c){ return '<col style="width:' + c.w + 'px">'; }).join('')
        + '<col style="width:118px"></colgroup>';
  h += '<thead><tr><th class="ck"><input type="checkbox" id="qcAll"></th>';
  cols.forEach(function(c){ h += '<th>' + esc(c.t) + arrow(c) + '</th>'; });
  h += '<th class="op">操作<span class="qcf-gear" id="qcGear" title="表头设置">⚙</span></th></tr>';
  h += '<tr class="qcf-frow"><th class="ck"></th>';
  cols.forEach(function(c){ h += '<th>' + qc2Ctl(c) + '</th>'; });
  h += '<th class="op"></th></tr></thead><tbody>';

  if (!view.length) {
    h += '<tr class="or-empty"><td colspan="' + (cols.length + 2) + '">没有符合条件的质控记录</td></tr>';
  } else {
    view.forEach(function(r){
      var on = !!QC2_S.sel[r.idx];
      h += '<tr' + (on ? ' class="sel"' : '') + '><td class="ck"><input type="checkbox" data-qck="' + r.idx + '"'
         + (on ? ' checked' : '') + '></td>';
      cols.forEach(function(c){
        var v = esc(r[c.k]);
        if (c.k === 'state') {
          var col = r.state.indexOf('成功') >= 0 ? 'var(--ok)' : (r.state.indexOf('失败') >= 0 ? 'var(--bad)' : 'var(--warn)');
          v = '<span class="st-dot" style="background:' + col + '"></span>' + esc(r.state);
        }
        if (c.k === 'name' || c.k === 'sid') v = '<span class="ell" title="' + esc(r[c.k]) + '">' + esc(r[c.k]) + '</span>';
        h += '<td' + (c.k === 'time' ? ' class="mono"' : '') + '>' + v + '</td>';
      });
      h += '<td class="op"><a class="lnk" data-qca="' + esc(r.sid) + '">审核</a>'
         + '<a class="lnk danger" data-qcd="' + esc(r.sid) + '">删除</a></td></tr>';
    });
  }
  h += '</tbody>';
  document.getElementById('qcTable2').innerHTML = h;

  var selN = Object.keys(QC2_S.sel).filter(function(x){ return QC2_S.sel[x]; }).length;
  var btns = '<button data-p="' + (QC2_S.page - 1) + '"' + (QC2_S.page <= 1 ? ' disabled' : '') + '>‹</button>';
  var pages = [];
  for (var p = 1; p <= maxP; p++) if (p <= 5 || p === maxP || Math.abs(p - QC2_S.page) <= 1) pages.push(p);
  var last = 0;
  pages.forEach(function(p){
    if (last && p - last > 1) btns += '<span class="gap">…</span>';
    btns += '<button data-p="' + p + '" class="' + (p === QC2_S.page ? 'on' : '') + '">' + p + '</button>';
    last = p;
  });
  btns += '<button data-p="' + (QC2_S.page + 1) + '"' + (QC2_S.page >= maxP ? ' disabled' : '') + '>›</button>';

  document.getElementById('qcPager').innerHTML =
      '<span class="info"><span>共 <b>' + rows.length + '</b> 条</span><span class="bar">|</span>'
    + '<span>已选 <b>' + selN + '</b> 个</span><a id="qcReset">清除筛选</a></span>'
    + '<span class="btns">'
    +   btns
    +   '<select id="qcSize">'
    +     [20,50,100].map(function(n){ return '<option value="' + n + '"' + (n === QC2_S.size ? ' selected' : '') + '>' + n + '条/页</option>'; }).join('')
    +   '</select>'
    +   '<span class="jump">前往<input id="qcJump" placeholder=""><span>页</span></span>'
    + '</span>';

  cols.forEach(function(c){
    var id = 'qcf_' + c.k;
    if (c.f === 'date') {
      ['_from','_to'].forEach(function(sfx){
        var e = document.getElementById(id + sfx);
        if (e) e.onchange = function(){
          QC2_F[c.k].from = document.getElementById(id + '_from').value;
          QC2_F[c.k].to   = document.getElementById(id + '_to').value;
          QC2_S.page = 1; renderQc();
        };
      });
    } else {
      var el = document.getElementById(id);
      if (el) {

var QA_CAT = {
  '图像清晰度较差': '图像清晰度',
  '图像位置偏下':   '中心线',
  '存在运动伪影':   '图像伪影',

var QA_END = '2026-10-27';
var QA_S = { period:'month', stage:'终末', dev:'CT', type:'系统', tab:'sum',
             cFrom:'2026-08-01', cTo:'2026-10-27' };

function qaFmt(d){
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function qaDot(d){ return d.replace(/-/g,'.'); }
function qaShift(str, months){
  var m = str.match(/(\d{4})-(\d{2})-(\d{2})/);
  var d = new Date(+m[1], +m[2] - 1, +m[3]);
  d.setMonth(d.getMonth() + months);
  return qaFmt(d);
}
function qaShiftDays(str, n){
  var m = str.match(/(\d{4})-(\d{2})-(\d{2})/);
  var d = new Date(+m[1], +m[2] - 1, +m[3]);
  d.setDate(d.getDate() + n);
  return qaFmt(d);
}
function qaSpan(from, to){
  var a = from.match(/(\d{4})-(\d{2})-(\d{2})/), b = to.match(/(\d{4})-(\d{2})-(\d{2})/);
  var d1 = new Date(+a[1], +a[2] - 1, +a[3]), d2 = new Date(+b[1], +b[2] - 1, +b[3]);
  return Math.round((d2 - d1) / 86400000);
}
function qaRanges(){
  var to = QA_END, from;
  if (QA_S.period === 'month') from = qaShift(to, -1);
  else if (QA_S.period === 'quarter') from = qaShift(to, -3);
  else if (QA_S.period === 'half') from = qaShift(to, -6);
  else { from = QA_S.cFrom; to = QA_S.cTo; }
  var span = qaSpan(from, to);
  var prevTo = qaShiftDays(from, -1);
  var prevFrom = qaShiftDays(prevTo, -span);
  var yoyTo = qaShiftDays(qaShift(to, -12), 0);
  var yoyFrom = qaShiftDays(yoyTo, -span);
  return { from:from, to:to, prevFrom:prevFrom, prevTo:prevTo, yoyFrom:yoyFrom, yoyTo:yoyTo };
}
function qaPick(f, t){
  return QA_ROWS.filter(function(r){
    if (r.d < f || r.d > t) return false;
    if (QA_S.stage && r.stage !== QA_S.stage) return false;
    if (QA_S.dev && r.dev !== QA_S.dev) return false;
    if (QA_S.type && r.type !== QA_S.type) return false;
    return true;
  });
}
function qaCount(rows, g){ return rows.filter(function(r){ return r.grade === g; }).length; }
function qaCatName(issue){ return QA_CAT[issue] || '其他'; }
function qaCatCount(rows, cat){
  return rows.filter(function(r){
    return r.issues.some(function(i){ return qaCatName(i) === cat; });
  }).length;
}
function qaIssuesOf(rows, cat){
  var m = {};
  rows.forEach(function(r){
    r.issues.forEach(function(i){
      if (qaCatName(i) === cat) m[i] = (m[i] || 0) + 1;
    });
  });
  return m;
}

/* ---------- 环形图 ---------- */
function qaDonut(segs, total, singleColor){
  var S = 132, r = S / 2 - 15, c = 2 * Math.PI * r, cx = S / 2, off = 0;
  var s = '<svg width="' + S + '" height="' + S + '" viewBox="0 0 ' + S + ' ' + S + '">';
  s += '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="#EEF1F6" stroke-width="16"/>';
  segs.forEach(function(sg){
    var len = total ? c * sg.v / total : 0;
    var col = (segs.length === 1) ? singleColor : sg.c;
    s += '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + col + '"'
       + ' stroke-width="16" stroke-dasharray="' + len.toFixed(2) + ' ' + (c - len).toFixed(2) + '"'
       + ' stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cx + ')"/>';
    off += len;
  });
  s += '<text x="' + cx + '" y="' + (cx - 4) + '" text-anchor="middle" style="font-size:10px;fill:#999">总数</text>'
     + '<text x="' + cx + '" y="' + (cx + 14) + '" text-anchor="middle" style="font-size:19px;font-weight:600;fill:#1E3A6F">'
     + total + '</text>'
     + '<text x="' + cx + '" y="' + (cx + 26) + '" text-anchor="middle" style="font-size:9.5px;fill:#999">例</text>';
  s += '</svg>';
  return s;
}

/* ---------- 柱+线组合图 ---------- */
function qaCombo(legend, prevLabel, curLabel, prev, cur){
  var W = 500, H = 196, pl = 34, pr = 14, pt = 24, pb = 40;
  var iw = W - pl - pr, ih = H - pt - pb;
  var max = Math.max(prev, cur, 1);
  var raw = max / 5;
  var cands = [0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000];
  var step = cands[cands.length - 1];
  for (var ci = 0; ci < cands.length; ci++) { if (cands[ci] >= raw - 1e-9) { step = cands[ci]; break; } }
  var top = Math.ceil(max / step) * step;
  top = +top.toFixed(6);
  var Y = function(v){ return pt + ih * (1 - v / top); };
  var xs = [pl + iw * 0.28, pl + iw * 0.72];
  var bw = 46;
  var s = '<svg class="qa-chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
  s += '<defs><linearGradient id="qaBar' + legend + '" x1="0" y1="0" x2="0" y2="1">'
     + '<stop offset="0%" stop-color="#3B82F6" stop-opacity=".92"/>'
     + '<stop offset="100%" stop-color="#3B82F6" stop-opacity=".55"/></linearGradient></defs>';
  for (var v = 0; v <= top + 1e-9; v += step) {
    var y = Y(v);
    var tv = (Math.abs(v - Math.round(v)) < 1e-9) ? String(Math.round(v)) : v.toFixed(1);
    s += '<line class="ax" x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '"/>'
       + '<text x="' + (pl - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + tv + '</text>';
  }
  [[xs[0], prev], [xs[1], cur]].forEach(function(p){
    s += '<rect x="' + (p[0] - bw / 2) + '" y="' + Y(p[1]) + '" width="' + bw + '" height="' + (Y(0) - Y(p[1]))
       + '" rx="2" fill="url(#qaBar' + legend + ')"/>';
    s += '<text class="vl" x="' + p[0] + '" y="' + (Y(p[1]) - 7) + '" text-anchor="middle">' + p[1] + '</text>';
  });
  s += '<polyline points="' + xs[0] + ',' + Y(prev) + ' ' + xs[1] + ',' + Y(cur)
     + '" fill="none" stroke="#1E3A6F" stroke-width="1.8"/>';
  [[xs[0], prev], [xs[1], cur]].forEach(function(p){
    s += '<circle cx="' + p[0] + '" cy="' + Y(p[1]) + '" r="3.4" fill="#fff" stroke="#1E3A6F" stroke-width="1.8"/>';
  });
  s += '<text x="' + xs[0] + '" y="' + (H - 20) + '" text-anchor="middle">' + esc(prevLabel[0]) + '</text>'
     + '<text x="' + xs[0] + '" y="' + (H - 7) + '" text-anchor="middle" style="fill:#1E3A6F">' + esc(prevLabel[1]) + '</text>'
     + '<text x="' + xs[1] + '" y="' + (H - 20) + '" text-anchor="middle">' + esc(curLabel[0]) + '</text>'
     + '<text x="' + xs[1] + '" y="' + (H - 7) + '" text-anchor="middle" style="fill:#1E3A6F">' + esc(curLabel[1]) + '</text>';
  s += '<rect x="' + (W - 148) + '" y="6" width="10" height="10" rx="2" fill="#3B82F6"/>'
     + '<text x="' + (W - 133) + '" y="15">' + esc(legend) + '</text>'
     + '<line x1="' + (W - 92) + '" y1="11" x2="' + (W - 74) + '" y2="11" stroke="#1E3A6F" stroke-width="1.8"/>'
     + '<circle cx="' + (W - 83) + '" cy="11" r="3.2" fill="#fff" stroke="#1E3A6F" stroke-width="1.6"/>'
     + '<text x="' + (W - 68) + '" y="15">趋势</text>';
  s += '</svg>';
  return s;
}

/* ---------- 文案工具 ---------- */
function qaDelta(a, b, unit){
  var d = b - a;
  if (d === 0) return '不变';
  return (d > 0 ? '增加' : '减少') + Math.abs(d) + unit;
}
function qaDeltaStrict(a, b, unit){
  var d = b - a;
  if (d === 0) return '不变';
  return (d > 0 ? '增加' : '降低') + Math.abs(d) + unit;
}
function qaTrend(a, b){
  if (b > a) return '上升';
  if (b < a) return '下降';
  return '持平';
}

/* ---------- 主渲染 ---------- */
function renderQa(){
  var R = qaRanges();
  var cur = qaPick(R.from, R.to);
  var prev = qaPick(R.prevFrom, R.prevTo);
  var yoy = qaPick(R.yoyFrom, R.yoyTo);
  var isSum = QA_S.tab === 'sum';

  document.getElementById('qaRange').textContent = qaDot(R.from) + '–' + qaDot(R.to);
  document.getElementById('qaCap').textContent =
    qaDot(R.from) + '–' + qaDot(R.to) + ' 完成质控 ' + cur.length + ' 例';

  var passN = cur.filter(function(r){ return r.grade !== '丁'; }).length;
  var failN = cur.length - passN;
  var rate = cur.length ? (passN / cur.length * 100).toFixed(0) : '0';
  var failRate = cur.length ? (failN / cur.length * 100).toFixed(0) : '0';
  document.getElementById('qaKpis').innerHTML =
      '<div class="qa-kpi"><div class="lb">报告总数</div><div class="vl">' + cur.length + '</div></div>'
    + '<div class="qa-kpi"><div class="lb">已达标（例）</div><div class="vl">' + passN + '</div>'
    + '<div class="dt">占比 <b>' + rate + '%</b></div></div>'
    + '<div class="qa-kpi ' + (failN ? 'bad' : '') + '"><div class="lb">未达标（例）</div><div class="vl">' + failN + '</div>'
    + '<div class="dt">占比 <b>' + failRate + '%</b></div></div>';

  var hasIssue = cur.some(function(r){ return r.issues.length; });
  document.getElementById('qaFocus').classList.toggle('hidden', !(isSum ? hasIssue : hasIssue));

  if (isSum) renderQaSum(R, cur, prev, yoy);
  else renderQaKey(R, cur, prev, yoy);

function qaShareText(cur, base, when, unit){
  if (!base.length) return '等级占比方面，' + when + '无样本，占比不可比。';
  var ups = [], downs = [], flats = [];
  QA_GRADES.forEach(function(g){
    var c1 = qaCount(base, g) / base.length, c2 = qaCount(cur, g) / (cur.length || 1);
    var d = c2 - c1;
    if (d > 0.0001) ups.push(g); else if (d < -0.0001) downs.push(g); else flats.push(g);
  });
  var seg = [];
  if (ups.length) seg.push(ups.join('、') + '级占比上升');
  if (downs.length) seg.push(downs.join('、') + '级占比下降');
  if (flats.length) seg.push(flats.join('、') + '级未见明显改变');
  return '等级占比方面，' + seg.join('，') + '。';
}

function qaKeyText(R, cur, base, kind, bf, bt, when){
  var d = cur.length - base.length;
  var trendWord = (d > 0) ? '增加' : (d < 0 ? '降低' : '持平');
  var s = '本期（' + qaDot(R.from) + '–' + qaDot(R.to) + '）完成质控' + cur.length + '例，'
        + when + '（' + qaDot(bf) + '–' + qaDot(bt) + '）' + QA_S.stage + '影像质控共' + base.length + '例，'
        + '总数' + kind + (d === 0 ? '持平' : trendWord + Math.abs(d) + '例')
        + '，趋势' + qaTrend(base.length, cur.length) + '。';
  var parts = QA_CATS.map(function(cat){
    return cat + qaDelta(qaCatCount(base, cat), qaCatCount(cur, cat), '例');
  }).filter(function(x){ return true; });
  s += '其中' + parts.join('，') + '。';
  /* 占比 */
  var up = [], down = [], flat = [];
  QA_CATS.forEach(function(cat){
    var t1 = 0, t2 = 0;
    base.forEach(function(r){ t1 += r.issues.length; });
    cur.forEach(function(r){ t2 += r.issues.length; });
    var c1 = t1 ? (base.filter(function(r){ return r.issues.some(function(i){ return qaCatName(i) === cat; }); }).length) / Math.max(t1, 1) : 0;
    var c2 = t2 ? (cur.filter(function(r){ return r.issues.some(function(i){ return qaCatName(i) === cat; }); }).length) / Math.max(t2, 1) : 0;
    if (!t1) { up.push(cat); return; }
    var dd = c2 - c1;
    if (dd > 0.0001) up.push(cat); else if (dd < -0.0001) down.push(cat); else flat.push(cat);
  });
  var seg = [];
  if (up.length) seg.push(up.join('、') + '占比上升');
  if (down.length) seg.push(down.join('、') + '占比下降');
  if (flat.length) seg.push(flat.join('、') + '未见明显改变');
  s += '问题占比方面，' + (seg.join('，') || '未见明显改变') + '。';
  return s;
}

/* ---------- 绑定 ---------- */
function bindQa(){
  if (bindQa._done) return;
  bindQa._done = true;

  [['qaPeriod','period'], ['qaStage','stage'], ['qaType','type']].forEach(function(p){
    var box = document.getElementById(p[0]);
    [].forEach.call(box.querySelectorAll('button'), function(b){
      b.onclick = function(){
        [].forEach.call(box.querySelectorAll('button'), function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        QA_S[p[1]] = b.getAttribute('data-v');
        if (p[1] === 'period') document.getElementById('qaCustom').classList.toggle('hidden', QA_S.period !== 'custom');
        renderQa();
      };
    });
  });
  document.getElementById('qaDev').onchange = function(){ QA_S.dev = this.value; renderQa(); };
  document.getElementById('qaQuery').onclick = function(){ renderQa(); toast('已按当前条件查询'); };
  document.getElementById('qaReset').onclick = function(){
    QA_S.period = 'month'; QA_S.stage = '终末'; QA_S.dev = 'CT'; QA_S.type = '系统';
    [['qaPeriod','month'], ['qaStage','终末'], ['qaType','系统']].forEach(function(p){
      [].forEach.call(document.getElementById(p[0]).querySelectorAll('button'), function(b){
        b.classList.toggle('on', b.getAttribute('data-v') === p[1]);
      });
    });
    document.getElementById('qaDev').value = 'CT';
    renderQa(); toast('已重置筛选条件');
  };
  document.getElementById('qaAiReport').onclick = function(){ openAiReport(); };
  [].forEach.call(document.querySelectorAll('#qaTabs2 button'), function(b){
    b.onclick = function(){
      [].forEach.call(document.querySelectorAll('#qaTabs2 button'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      QA_S.tab = b.getAttribute('data-v');
      renderQa();
    };
  });
  /* 自定义区间 */
  var bar = document.querySelector('#tabImg .qa-bar');
  var cw = document.createElement('span');
  cw.id = 'qaCustom';
  cw.className = 'hidden';
  cw.style.cssText = 'display:none;align-items:center;gap:6px';
  cw.innerHTML = '<input type="date" id="qaFrom" value="2026-08-01" class="qa-sel" style="width:140px">'
               + '<span style="color:#999;font-size:12px">至</span>'
               + '<input type="date" id="qaTo" value="2026-10-27" class="qa-sel" style="width:140px">';
  bar.insertBefore(cw, document.getElementById('qaRange'));
  ['qaFrom','qaTo'].forEach(function(id){
    document.getElementById(id).onchange = function(){
      QA_S.cFrom = document.getElementById('qaFrom').value || '2026-08-01';
      QA_S.cTo = document.getElementById('qaTo').value || '2026-10-27';
      if (QA_S.period === 'custom') renderQa();
    };
  });
  renderQa();
}

  '诊断建议规范性':'诊断书写规范性', '诊断内容规范性':'诊断书写规范性', '诊断建议不规范':'诊断书写规范性',
  '诊断内容不规范':'诊断书写规范性', '过度诊断':'诊断书写规范性',
  '阳性病变描述顺序规范性':'所见描述规范性', '阳性病变部位描述规范性':'所见描述规范性',
  '阳性病变形态描述规范性':'所见描述规范性', '阳性病变密度描述规范性':'所见描述规范性',
  '病灶形态描述不规范':'所见描述规范性', '病灶密度描述不规范':'所见描述规范性',
  '病灶部位描述不规范':'所见描述规范性', '病灶边缘描述不规范':'所见描述规范性',
  '格式与符号不规范':'书写格式规范性', '口语化与错别字':'书写格式规范性',
  '报告整体逻辑性':'所见诊断一致性', '报告文本规范性':'书写格式规范性',
  '诊断顺序规范性':'诊断规范性'
};

var RP_END = '2026-10-27';
var RP_S = { period:'month', stage:'终末', dev:'CT', type:'系统', tab:'sum',
             cFrom:'2026-08-01', cTo:'2026-10-27' };

function rpDay(n){
  var base = new Date(2026, 9, 27);
  base.setDate(base.getDate() - (n % 30));
  var p = function(x){ return (x < 10 ? '0' : '') + x; };
  return base.getFullYear() + '-' + p(base.getMonth() + 1) + '-' + p(base.getDate());
}
function rpPct(c, base){
  if (!base) return '0%';
  var v = c / base * 100;
  var s = v.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
  return s + '%';
}

/* 由等级问题表生成逐条记录（供筛选子集使用） */
var RP_ROWS = (function(){
  var rows = [], seq = 0;
  RP_GRADES.forEach(function(g){
    var N = RP_GRADE_N[g], recs = [];
    for (var i = 0; i < N; i++) recs.push({ grade:g, issues:[] });
    RP_SUM[g].forEach(function(it, k){
      var start = Math.floor(k * N / RP_SUM[g].length);
      for (var c = 0; c < it[1]; c++) recs[(start + c) % N].issues.push(it[0]);
    });
    recs.forEach(function(r){
      seq++;
      rows.push({ idx:seq, d:rpDay(seq), stage:'终末', dev:'CT', type:'系统',
                  grade:r.grade, issues:r.issues });
    });
  });
  /* 上一周期 6 例：甲4 / 乙2（含 1 例诊断书写问题） */
  for (var i = 0; i < 6; i++) {
    rows.push({ idx:++seq, d:(i < 4 ? '2026-09-10' : '2026-09-05'), stage:'终末', dev:'CT', type:'系统',
                grade:(i < 4 ? '甲' : '乙'),
                issues:(i === 5 ? ['诊断建议规范性'] : []) });
  }
  /* 其它组合：MR / 事中 / 人工，各若干例 */
  var extra = [
    ['MR','终末','系统', 6,'乙'], ['MR','终末','系统', 4,'丙'],
    ['CT','事中','系统', 9,'乙'], ['CT','事中','系统', 3,'丙'],
    ['CT','终末','人工', 7,'甲'], ['CT','终末','人工', 5,'乙'],
    ['DR','终末','系统', 3,'丙'], ['MR','事中','人工', 2,'丁']
  ];
  extra.forEach(function(e){
    for (var k = 0; k < e[3]; k++) {
      rows.push({ idx:++seq, d:rpDay(seq + 3), stage:e[1], dev:e[0], type:e[2], grade:e[4],
                  issues:(k % 3 === 0 ? ['诊断建议规范性'] : (k % 3 === 1 ? ['病灶形态描述不规范'] : [])) });
    }
  });
  return rows;
})();

function rpRange(){
  var to = RP_END, from;
  if (RP_S.period === 'month') from = qaShift(to, -1);
  else if (RP_S.period === 'quarter') from = qaShift(to, -3);
  else if (RP_S.period === 'half') from = qaShift(to, -6);
  else { from = RP_S.cFrom; to = RP_S.cTo; }
  var span = qaSpan(from, to);
  var prevTo = qaShiftDays(from, -1);
  return { from:from, to:to, prevFrom:qaShiftDays(prevTo, -span), prevTo:prevTo,
           yoyFrom:qaShiftDays(qaShift(to, -12), -span), yoyTo:qaShiftDays(qaShift(to, -12), 0) };
}

function rpFilter(f, t){
  return RP_ROWS.filter(function(r){
    if (r.d < f || r.d > t) return false;
    if (RP_S.stage && r.stage !== RP_S.stage) return false;
    if (RP_S.dev && r.dev !== RP_S.dev) return false;
    if (RP_S.type && r.type !== RP_S.type) return false;
    return true;
  });
}

/* 默认口径直接输出与设计稿一致的聚合快照 */
function rpIsDefault(){
  return RP_S.period === 'month' && RP_S.stage === '终末' && RP_S.dev === 'CT' && RP_S.type === '系统';
}

function rpAggregate(){
  var R = rpRange();
  if (rpIsDefault()) {
    return {
      static:true, R:R, total:365,
      grades:{ '甲':23,'乙':198,'丙':132,'丁':12 },
      sumItems:RP_SUM, keyCats:RP_KEY,
      prevTotal:6, prevGrades:{ '甲':4,'乙':2,'丙':0,'丁':0 }, prevKey:RP_KEY_PREV,
      yoyTotal:0, yoyGrades:{ '甲':0,'乙':0,'丙':0,'丁':0 }, yoyKey:{}
    };
  }
  var cur = rpFilter(R.from, R.to);
  var prev = rpFilter(R.prevFrom, R.prevTo);
  var yoy = rpFilter(R.yoyFrom, R.yoyTo);
  function pack(rows){
    var grades = { '甲':0,'乙':0,'丙':0,'丁':0 }, sumItems = {}, keyMap = {};
    rows.forEach(function(r){
      grades[r.grade]++;
      r.issues.forEach(function(it){
        (sumItems[r.grade] = sumItems[r.grade] || {});
        sumItems[r.grade][it] = (sumItems[r.grade][it] || 0) + 1;
        var cat = RP_CAT[it] || '其他';
        keyMap[cat] = keyMap[cat] || { set:{}, items:{} };
        keyMap[cat].set[r.idx] = 1;
        keyMap[cat].items[it] = (keyMap[cat].items[it] || 0) + 1;
      });
    });
    var si = {};
    RP_GRADES.forEach(function(g){
      si[g] = Object.keys(sumItems[g] || {}).map(function(k){ return [k, sumItems[g][k], 0]; })
                  .sort(function(a, b){ return b[1] - a[1]; });
    });
    var kc = Object.keys(keyMap).map(function(cat){
      return [cat, Object.keys(keyMap[cat].set).length, 0,
              Object.keys(keyMap[cat].items).map(function(k){ return [k, keyMap[cat].items[k], 0]; })
                    .sort(function(a, b){ return b[1] - a[1]; })];
    }).sort(function(a, b){ return b[1] - a[1]; });
    return { total:rows.length, grades:grades, sumItems:si, keyCats:kc, keyMap:keyMap };
  }
  var c = pack(cur), p = pack(prev), y = pack(yoy);
  var pk = {};
  p.keyCats.forEach(function(x){ pk[x[0]] = x[1]; });
  return { static:false, R:R, total:c.total, grades:c.grades, sumItems:c.sumItems, keyCats:c.keyCats,
           prevTotal:p.total, prevGrades:p.grades, prevKey:pk,
           yoyTotal:y.total, yoyGrades:y.grades, yoyKey:{} };
}

function renderRp(){
  var A = rpAggregate();
  var R = A.R;
  document.getElementById('rpRange').textContent = qaDot(R.from) + '–' + qaDot(R.to);
  document.getElementById('rpCap').textContent = qaDot(R.from) + '–' + qaDot(R.to) + ' 完成质控' + A.total + ' 例';

  var passN = A.total - A.grades['丁'];
  document.getElementById('rpKpis').innerHTML =
      '<div class="qa-kpi"><div class="lb">报告总数</div><div class="vl">' + A.total + '</div></div>'
    + '<div class="qa-kpi"><div class="lb">已达标（例）</div><div class="vl">' + passN + '</div>'
    + '<div class="dt">' + rpPct(passN, A.total) + '</div></div>'
    + '<div class="qa-kpi ' + (A.grades['丁'] ? 'bad' : '') + '"><div class="lb">未达标（例）</div>'
    + '<div class="vl">' + A.grades['丁'] + '</div><div class="dt">' + rpPct(A.grades['丁'], A.total) + '</div></div>';

  if (RP_S.tab === 'sum') rpRenderSum(A, R);
  else rpRenderKey(A, R);
}

function rpRenderSum(A, R){
  document.getElementById('rpCardTitle').textContent = '总体达标情况改进分析';
  document.getElementById('rpMomTitle').textContent = '环比数据分析';
  document.getElementById('rpYoyTitle').textContent = '同比数据分析';

  var segs = RP_GRADES.map(function(g){ return { g:g, v:A.grades[g], c:QA_COLOR[g] }; })
                      .filter(function(s){ return s.v > 0; });
  document.getElementById('rpDonut').innerHTML = qaDonut(segs, A.total, '#3B82F6');
  document.getElementById('rpDonutRow').classList.remove('below');
  var leg = document.getElementById('rpLeg');
  leg.className = 'qa-leg';
  leg.innerHTML = segs.map(function(sg){
    return '<div class="r"><i style="background:' + sg.c + '"></i><span>' + sg.g + ' ' + sg.v + '</span></div>';
  }).join('');

  var html = '';
  RP_GRADES.forEach(function(g){
    var n = A.grades[g];
    if (!n) return;
    html += '<div class="qa-grp"><div class="qa-grp-h"><span class="lt"><i style="background:' + QA_COLOR[g]
          + '"></i>' + g + '</span><span class="rt">占比 ' + rpPct(n, A.total) + ' | ' + n + ' 例</span></div>';
    var items = (A.sumItems[g] || []);
    if (!items.length) html += '<div class="qa-row">未检出问题项</div>';
    items.forEach(function(it){
      html += '<div class="qa-issue"><span>' + esc(it[0])
            + (it[2] ? '<em class="qa-tag">需关注</em>' : '') + '</span>'
            + '<span class="tk"><i style="width:' + Math.round(it[1] / n * 100) + '%"></i></span>'
            + '<span class="num">' + rpPct(it[1], n) + '</span>'
            + '<span class="num2">' + it[1] + '例</span></div>';
    });
    html += '</div>';
  });
  document.getElementById('rpDetail').innerHTML = html || '<div class="qa-empty">该条件下暂无质控样本</div>';
  document.getElementById('rpFocus').classList.toggle('hidden', !Object.keys(A.sumItems).some(function(g){
    return (A.sumItems[g] || []).some(function(it){ return it[2]; });
  }));

  document.getElementById('rpMomTxt').textContent = rpSumText(R, A, '环比', A.prevTotal, A.prevGrades, R.prevFrom, R.prevTo, '上一周期');
  document.getElementById('rpMomChart').innerHTML = qaCombo('环比',
    [qaDot(R.prevFrom) + '–' + qaDot(R.prevTo), '环比'], [qaDot(R.from) + '–' + qaDot(R.to), '当前'],
    A.prevTotal, A.total);
  document.getElementById('rpYoyTxt').textContent = rpSumText(R, A, '同比', A.yoyTotal, A.yoyGrades, R.yoyFrom, R.yoyTo, '去年同期');
  document.getElementById('rpYoyChart').innerHTML = qaCombo('同比',
    [qaDot(R.yoyFrom) + '–' + qaDot(R.yoyTo), '同比'], [qaDot(R.from) + '–' + qaDot(R.to), '当前'],
    A.yoyTotal, A.total);
}

function rpSumText(R, A, kind, baseTotal, baseGrades, bf, bt, when){
  var d = A.total - baseTotal;
  var s = '本期 ' + qaDot(R.from) + '–' + qaDot(R.to) + ' 完成' + RP_S.stage + '报告 ' + A.total + ' 例；'
        + when + ' ' + qaDot(bf) + '–' + qaDot(bt) + ' 完成 ' + baseTotal + ' 例。'
        + '总数' + kind + qaDelta(baseTotal, A.total, '例') + '，趋势' + qaTrend(baseTotal, A.total) + '。'
        + '其中' + RP_GRADES.map(function(g){ return g + '级' + qaDelta(baseGrades[g] || 0, A.grades[g], '例'); }).join('，') + '。';
  var ups = [], downs = [], flats = [];
  RP_GRADES.forEach(function(g){
    var c1 = baseTotal ? (baseGrades[g] || 0) / baseTotal : 0, c2 = A.grades[g] / (A.total || 1);
    var dd = c2 - c1;
    if (dd > 0.0001) ups.push(g); else if (dd < -0.0001) downs.push(g); else flats.push(g);
  });
  var seg = [];
  if (ups.length) seg.push(ups.join('、') + '级占比上升');
  if (downs.length) seg.push(downs.join('、') + '级占比下降');
  if (flats.length) seg.push(flats.join('、') + '级未见明显改变');
  s += '等级占比方面，' + (seg.join('，') || '未见明显改变') + '。';
  return s;
}

function rpRenderKey(A, R){
  document.getElementById('rpCardTitle').textContent = '关键问题分析改进分析';
  document.getElementById('rpMomTitle').textContent = '环比问题分析';
  document.getElementById('rpYoyTitle').textContent = '同比问题分析';

  var cats = A.keyCats;
  var segs = cats.map(function(c, i){ return { g:c[0], v:c[1], c:['#3B82F6','#18A058','#FAAD14','#7C6CF0','#D03050'][i % 5] }; });
  document.getElementById('rpDonut').innerHTML = qaDonut(segs, segs.reduce(function(a, b){ return a + b.v; }, 0), '#3B82F6');
  document.getElementById('rpDonutRow').classList.add('below');
  var leg = document.getElementById('rpLeg');
  leg.className = 'qa-leg inline';
  leg.innerHTML = segs.map(function(sg){
    return '<span class="r"><i style="background:' + sg.c + '"></i>' + esc(sg.g) + ' ' + sg.v + '</span>';
  }).join('');

  var html = '';
  cats.forEach(function(c){
    html += '<div class="qa-grp"><div class="qa-grp-h"><span class="lt">'
          + (c[2] ? '<em class="qa-alert">！</em>' : '<i style="background:#3B82F6"></i>')
          + esc(c[0]) + '</span>'
          + '<span class="rt">占比 ' + rpPct(c[1], A.total) + ' | ' + c[1] + ' 例</span></div>';
    c[3].forEach(function(it){
      html += '<div class="qa-issue"><span>' + esc(it[0])
            + (it[2] ? '<em class="qa-tag">需关注</em>' : '') + '</span>'
            + '<span class="tk"><i style="width:' + Math.round(it[1] / c[1] * 100) + '%"></i></span>'
            + '<span class="num">' + rpPct(it[1], c[1]) + '</span>'
            + '<span class="num2">' + it[1] + '例</span></div>';
    });
    html += '</div>';
  });
  document.getElementById('rpDetail').innerHTML = html || '<div class="qa-empty">该条件下暂无质控问题</div>';
  document.getElementById('rpFocus').classList.toggle('hidden', !cats.some(function(c){ return c[2]; }));

  document.getElementById('rpMomTxt').textContent = rpKeyText(R, A, '环比', A.prevTotal, A.prevKey,
    R.prevFrom, R.prevTo, '上一周期');
  document.getElementById('rpMomChart').innerHTML = qaCombo('环比',
    [qaDot(R.prevFrom) + '–' + qaDot(R.prevTo), '环比'], [qaDot(R.from) + '–' + qaDot(R.to), '当前'],
    A.prevTotal, A.total);
  document.getElementById('rpYoyTxt').textContent = rpKeyText(R, A, '同比', A.yoyTotal, A.yoyKey || {},
    R.yoyFrom, R.yoyTo, '去年同期');
  document.getElementById('rpYoyChart').innerHTML = qaCombo('同比',
    [qaDot(R.yoyFrom) + '–' + qaDot(R.yoyTo), '同比'], [qaDot(R.from) + '–' + qaDot(R.to), '当前'],
    A.yoyTotal, A.total);
}

function rpKeyText(R, A, kind, baseTotal, baseKey, bf, bt, when){
  var d = A.total - baseTotal;
  var s = '本期（' + qaDot(R.from) + '–' + qaDot(R.to) + '）完成质控' + A.total + '例，'
        + when + '（' + qaDot(bf) + '–' + qaDot(bt) + '）' + RP_S.stage + '报告质控共' + baseTotal + '例，'
        + '总数' + kind + (d === 0 ? '持平' : qaDelta(baseTotal, A.total, '例')) + '，趋势'
        + qaTrend(baseTotal, A.total) + '。';
  s += '其中' + A.keyCats.map(function(c){
    return c[0] + qaDelta(baseKey[c[0]] || 0, c[1], '例');
  }).join('，') + '。';
  var ups = [], downs = [], flats = [];
  A.keyCats.forEach(function(c){
    var c1 = baseTotal ? (baseKey[c[0]] || 0) / baseTotal : 0, c2 = c[1] / (A.total || 1);
    var dd = c2 - c1;
    if (dd > 0.0001) ups.push(c[0]); else if (dd < -0.0001) downs.push(c[0]); else flats.push(c[0]);
  });
  var seg = [];
  if (ups.length) seg.push(ups.join('、') + '占比上升');
  if (downs.length) seg.push(downs.join('、') + '占比下降');
  if (flats.length) seg.push(flats.join('、') + '未见明显改变');
  s += '问题占比方面，' + (seg.join('，') || '未见明显改变') + '。';
  return s;
}

/* ---------- 报告版 AI 分析报告 ---------- */
function openRpReport(){
  openAiReport('报告');
}

function bindRp(){
  if (bindRp._done) return;
  bindRp._done = true;
  [['rpPeriod','period'], ['rpStage','stage'], ['rpType','type']].forEach(function(p){
    var box = document.getElementById(p[0]);
    [].forEach.call(box.querySelectorAll('button'), function(b){
      b.onclick = function(){
        [].forEach.call(box.querySelectorAll('button'), function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        RP_S[p[1]] = b.getAttribute('data-v');
        renderRp();
      };
    });
  });
  document.getElementById('rpDev').onchange = function(){ RP_S.dev = this.value; renderRp(); };
  document.getElementById('rpQuery').onclick = function(){ renderRp(); toast('已按当前条件查询'); };
  document.getElementById('rpReset').onclick = function(){
    RP_S.period = 'month'; RP_S.stage = '终末'; RP_S.dev = 'CT'; RP_S.type = '系统';
    [['rpPeriod','month'], ['rpStage','终末'], ['rpType','系统']].forEach(function(p){
      [].forEach.call(document.getElementById(p[0]).querySelectorAll('button'), function(b){
        b.classList.toggle('on', b.getAttribute('data-v') === p[1]);
      });
    });
    document.getElementById('rpDev').value = 'CT';
    renderRp(); toast('已重置筛选条件');
  };
  document.getElementById('rpAiReport').onclick = function(){ openRpReport(); };
  [].forEach.call(document.querySelectorAll('#rpTabs button'), function(b){
    b.onclick = function(){
      [].forEach.call(document.querySelectorAll('#rpTabs button'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      RP_S.tab = b.getAttribute('data-v');
      renderRp();
    };
  });
  renderRp();
}

/* ---------- 交互 ---------- */
[].forEach.call(document.querySelectorAll('#qcTabs .tab'), function(b){
  b.onclick = function(){ showTab(b.getAttribute('data-tab')); };
});
document.getElementById('qcRefresh').onclick = function(){ renderQc(); toast('质控列表已刷新'); };
document.getElementById('qcRecalc').onclick = function(){
  var n = Object.keys(QC2_S.sel).filter(function(x){ return QC2_S.sel[x]; }).length;
  toast(n ? '已提交 ' + n + ' 条重新质控' : '请先勾选要重新质控的记录');
};
document.getElementById('qcAi').onclick = function(){ toast('已提交 AI 质控（示例）'); };
document.getElementById('qcFav').onclick = function(){ toast('已加入收藏（示例）'); };
document.getElementById('winMin').onclick = function(){ toast('最小化（示例）'); };
document.getElementById('winMax').onclick = function(){ toast('最大化（示例）'); };
document.getElementById('winClose').onclick = function(){ toast('已关闭当前页面（示例）'); };
document.addEventListener('click', function(e){
  var m = document.getElementById('qcMenu');
  if (!m) return;
  if (e.target.closest && (e.target.closest('#qcMenu') || e.target.closest('#qcGear'))) return;
  m.remove();
});

renderQc();
