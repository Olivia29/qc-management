  ['阳性病变部位描述规范性','must',-5,'"双侧肺野"未细化到肺叶/肺段。'],
  ['阳性病变描述顺序规范性','sug',-2,'阳性病变未按主次顺序排列。']
];

var VWR_IMG_ISS = [
  { cat:'存在运动伪影', pin:1, type:'must', delta:-10,
    desc:'图像存在运动伪影（如高低密度交替的条纹、重叠伪影，或导致正常组织结构模糊的伪影）',
    adv:'请结合检查目的评估伪影等级和影响诊断程度' },
  { cat:'图像位置偏下', pin:1, type:'sug', delta:-5, desc:'胸廓下缘至图像底部的距离小于上缘至图像顶部的距离' },
  { cat:'扫描上界超出肺尖', pin:1, type:'sug', delta:-10, desc:'肺尖之上多扫超过两层' },
  { cat:'图像清晰度较差', pin:1, type:'sug', delta:-5, desc:'肺纹理显示欠清晰，细小结构边缘模糊，对比度不足' }
];

var VWR_GRADE_SCORE = { '甲':95, '乙':85, '丙':70, '丁':55 };
var VWR_REP_N      = { '甲':2, '乙':5, '丙':9, '丁':12 };
var VWR_IMG_N      = { '甲':2, '乙':3, '丙':4, '丁':5 };

var VWR_S = { sid:null, mode:'rep', slice:0 };

function vwrGrade(r){
  var m = String(r.sys || '').match(/[甲乙丙丁]/);
  return m ? m[0] : '乙';
}
function vwrIssueList(mode, g){
  var n = (mode === 'img' ? VWR_IMG_N : VWR_REP_N)[g] || 4;
  var base = (mode === 'img' ? VWR_IMG_ISS : VWR_REP_ISS).slice();
  var i = 0;
  while (base.length < n) {
    var e = VWR_REP_EXTRA[i % VWR_REP_EXTRA.length];
    base.push({ cat:e[0], pin:1, type:e[1], delta:e[2], desc:e[3] });
    i++;
  }
  return base.slice(0, n);
}
function vwrIssueHtml(list){
  return list.map(function(it, i){
    var lvl = it.type === 'must' ? '必须修改' : '建议修改';
    var d = it.delta > 0 ? ('+' + it.delta) : String(it.delta);
    return '<div class="vwr-iss' + (i === 0 ? ' on' : '') + '" data-type="' + it.type + '">'
      + '<div class="vwr-ih"><input type="checkbox" class="vwr-ck"><i class="vwr-ai">AI</i>'
      + '<span>' + esc(it.cat) + '</span><span class="sp"></span>'
      + '<span class="vwr-tag pin" style="background:#F3F4F6;color:#6B7280">📍 ' + it.pin + '</span>'
      + '<span class="vwr-tag ' + it.type + '">' + lvl + '</span>'
      + '<span class="vwr-tag ' + (it.delta < 0 ? 'minus' : 'zero') + '">' + d + '</span>'
      + '<span class="vwr-tag note">不提醒</span></div>'
      + '<p>' + esc(it.desc) + '</p>'
      + (it.adv ? '<div class="adv"><b>建议</b> ' + esc(it.adv) + ' ？</div>' : '')
      + '</div>';
  }).join('');
}
function vwrScoreBlock(score, g){
  var gcol = (g === '甲') ? '#16A34A' : (g === '乙') ? '#2563EB' : '#DC2626';
  return '<div class="vwr-score"><span>质控结果（分）</span><b>' + score + '</b><span>/100</span>'
    + '<span class="vwr-grade" style="color:' + gcol + '">' + g + '</span><span class="sp"></span>'
    + '<span class="vwr-sel">消息筛查 ▾</span></div>';
}
function vwrFoot(){
  return '<div class="vwr-foot2"><label><input type="checkbox" class="vwr-all">全选</label>'
    + '<span class="vwr-cnt">已选择 0 项</span><span class="sp"></span>'
    + '<button class="p vwr-read">已读</button><button class="s vwr-mute">不提醒</button></div>';
}

function vwrRepCols(r){
  var g = vwrGrade(r);
  var sm = String(r.sys || '').match(/([0-9]+)\s*$/);
  var score = sm ? +sm[1] : (VWR_GRADE_SCORE[g] || 85);
  var list = vwrIssueList('rep', g);
  var t = VWR_TXT[(r.idx || 0) % VWR_TXT.length];
  var locRows = [
    ['少许条', '（具体肺段）少量条索', '所见'],
    ['扫及', '所示', '所见'],
    ['低密度结…', '低密度影…', '所见'],
    ['稍低密度', '稍低密度影', '所见'],
    ['右肺少许', '右肺上叶后段少量', '所见']
  ].map(function(x){
    return '<tr><td>' + esc(x[0]) + '</td><td>' + esc(x[1]) + '</td><td>' + esc(x[2]) + '</td>'
      + '<td class="ed">编辑</td><td class="ed">✎</td></tr>';
  }).join('');

  return ''
  + '<div class="vwr-pane">'
  +   '<div class="vwr-pt"><span>患者报告</span><span class="sp"></span><a>✎ 标注全览</a></div>'
  +   '<div class="vwr-card"><div class="vwr-ch"><span>影像所见-原始报告</span><span class="sp"></span><i data-vwrx="1">×</i></div><p>' + esc(t.see) + '</p></div>'
  +   '<div class="vwr-card"><div class="vwr-ch"><span>影像诊断-原始报告</span><span class="sp"></span><i data-vwrx="2">×</i></div><p>' + esc(t.dx) + '</p></div>'
  + '</div>'
  + '<div class="vwr-pane">'
  +   '<div class="vwr-card"><div class="vwr-ch"><span>影像所见-质控后回写报告</span><span class="sp"></span><a data-copy="see2">复制</a></div><p>' + esc(t.see2) + '</p></div>'
  +   '<div class="vwr-card"><div class="vwr-ch"><span>影像诊断-质控后回写报告</span><span class="sp"></span><a data-copy="dx2">复制</a></div><p>' + esc(t.dx2) + '</p></div>'
  + '</div>'
  + '<div class="vwr-pane">'
  +   '<div class="vwr-pt"><span>报告质控结果</span><em>总问题数：' + list.length + '</em><span class="sp"></span><a>🗑 不提醒回收站</a></div>'
  +   vwrScoreBlock(score, g)
  +   '<div class="vwr-tabs"><button class="on" data-vwrt="must">必须修改</button><button data-vwrt="sug">建议修改</button><button data-vwrt="all">已读</button></div>'
  +   '<div class="vwr-issues">' + vwrIssueHtml(list) + '</div>'
  +   '<div class="vwr-loc"><div class="vwr-loc-h">口语化与错别字-定位详情</div>'
  +     '<table><thead><tr><th>原文</th><th>质控后</th><th>定位段落</th><th>标签1</th><th>操作</th></tr></thead>'
  +     '<tbody>' + locRows + '</tbody></table></div>'
  +   vwrFoot()
  + '</div>';
}

function vwrImgCols(r){
  /* 影像质控与报告质控是两套口径：影像侧固定按影像质控结果展示 */
  var g = '丙';
  var score = VWR_GRADE_SCORE[g];
  var list = VWR_IMG_ISS.slice();
  var n = (typeof CT_SLICES !== 'undefined') ? CT_SLICES.length : 0;
  var first = n ? CT_SLICES[0] : '';

  return ''
  + '<div class="vwr-pane" style="background:#FCFCFD">'
  +   '<div class="vwr-pt"><span>患者影像</span></div>'
  +   '<div class="vwr-series">'
  +     '<div class="vwr-thumb on" data-slice="0"><img src="' + first + '" alt="CT"><div class="cap"><b>iDose (4)</b>T: 1.50mm</div></div>'
  +   '</div>'
  + '</div>'
  + '<div class="vwr-pane" style="padding:0;overflow:hidden;border-right:1px solid #EEF1F5">'
  +   '<div class="imgv" id="vwImg"><img id="vwSlice" src="' + first + '" alt="CT">'
  +     '<span class="dir a">A</span><span class="dir r">R</span><span class="dir l">L</span><span class="dir p">P</span>'
  +     '<span class="cnt" id="vwCnt">张数: 1/' + n + '</span>'
  +     '<span class="bar"><input type="range" id="vwRange" min="1" max="' + Math.max(1, n) + '" value="1"></span>'
  +   '</div>'
  + '</div>'
  + '<div class="vwr-pane">'
  +   '<div class="vwr-pt"><span>影像质控结果</span><em>总问题数：' + list.length + '</em><span class="sp"></span><a>🗑 不提醒回收站</a></div>'
  +   vwrScoreBlock(score, g)
  +   '<div class="vwr-tabs"><button class="on" data-vwrt="must">必须修改</button><button data-vwrt="sug">建议修改</button><button data-vwrt="all">已读</button></div>'
  +   '<div class="vwr-issues">' + vwrIssueHtml(list) + '</div>'
  +   '<div class="vwr-loc"><div class="vwr-loc-h">' + esc(list[0].cat) + '-定位详情</div>'
  +     '<table><thead><tr><th>序列名</th><th>层厚</th><th>层数</th><th>备注</th></tr></thead>'
  +     '<tbody><tr><td>iDose (4)</td><td>1.50mm</td><td>' + n + '</td><td></td></tr></tbody></table></div>'
  +   vwrFoot()
  + '</div>';
}

function vwrRender(){
  var r = null;
  for (var i = 0; i < QC2.length; i++) if (QC2[i].sid === VWR_S.sid) { r = QC2[i]; break; }
  if (!r) return;
  document.getElementById('vwInfo').innerHTML =
      '<span>👤 <span class="k">患者:</span> <b>' + esc(r.name) + '</b></span>'
    + '<span><span class="k">检查项目:</span> ' + esc((r.etype || 'CT').split(' ')[0] + (r.part || '')) + (VWR_S.mode === 'img' ? '普通扫描' : '') + '</span>'
    + '<span><span class="k">检查日期:</span> ' + esc(r.time || '') + '</span>'
    + '<span><span class="k">检查号:</span> ' + esc(r.sid || '') + '</span>';
  var sb = document.getElementById('vwSearch');
  if (sb) sb.value = String(r.sid || '');
  var cols = document.getElementById('vwCols');
  cols.className = 'vwr-cols' + (VWR_S.mode === 'img' ? ' img' : '');
  cols.innerHTML = (VWR_S.mode === 'img') ? vwrImgCols(r) : vwrRepCols(r);
  [].forEach.call(document.querySelectorAll('.vwr-rail a'), function(a){
    a.classList.toggle('on', a.getAttribute('data-mode') === VWR_S.mode);
  });
  vwrBind(cols, r);
}

function vwrInitSlice(){
  var rg = document.getElementById('vwRange');
  var img = document.getElementById('vwSlice');
  if (!rg || !img || typeof CT_SLICES === 'undefined') return;
  var set = function(v){
    var i = Math.max(1, Math.min(CT_SLICES.length, +v)) - 1;
    VWR_S.slice = i;
    img.src = CT_SLICES[i];
    document.getElementById('vwCnt').textContent = '张数: ' + (i + 1) + '/' + CT_SLICES.length;
    var th = document.querySelector('.vwr-thumb');
    if (th) th.querySelector('img').src = CT_SLICES[i];
  };
  rg.oninput = function(){ set(rg.value); };
  var box = document.getElementById('vwImg');
  box.onwheel = function(e){ e.preventDefault(); set(Math.max(1, Math.min(CT_SLICES.length, VWR_S.slice + 1 + (e.deltaY > 0 ? 1 : -1)))); rg.value = VWR_S.slice + 1; };
  set(1);
}

function vwrBind(cols, r){
  var cnt = function(){
    var n = cols.querySelectorAll('.vwr-ck:checked').length;
    var el = cols.querySelector('.vwr-cnt'); if (el) el.textContent = '已选择 ' + n + ' 项';
  };
  [].forEach.call(cols.querySelectorAll('.vwr-ck'), function(c){ c.onchange = cnt; });
  [].forEach.call(cols.querySelectorAll('.vwr-all'), function(a){
    a.onchange = function(){
      [].forEach.call(cols.querySelectorAll('.vwr-iss'), function(c){
        if (c.style.display !== 'none') { var k = c.querySelector('.vwr-ck'); if (k) k.checked = a.checked; }
      });
      cnt();
    };
  });
  [].forEach.call(cols.querySelectorAll('.vwr-tabs button'), function(b){
    b.onclick = function(){
      /* 首次渲染展示全部；点当前已选中的「必须/建议」再点一次即回到全部 */
      var t = b.getAttribute('data-vwrt');
      if (b.classList.contains('on') && t !== 'all') t = 'all';
      [].forEach.call(cols.querySelectorAll('.vwr-tabs button'), function(x){ x.classList.toggle('on', x.getAttribute('data-vwrt') === t); });
      [].forEach.call(cols.querySelectorAll('.vwr-iss'), function(c){
        c.style.display = (t === 'all') ? '' : (c.getAttribute('data-type') === t ? '' : 'none');
      });
    };
  });
  [].forEach.call(cols.querySelectorAll('.vwr-read'), function(b){
    b.onclick = function(){ vwrClose(); toast('已标记为已读：' + r.sid); };
  });
  [].forEach.call(cols.querySelectorAll('.vwr-mute'), function(b){
    b.onclick = function(){ toast('已加入不提醒：' + r.sid); };
  });
  [].forEach.call(cols.querySelectorAll('[data-vwrx]'), function(x){
    x.onclick = function(){ var c = x.closest('.vwr-card'); if (c) c.style.display = 'none'; toast('已收起该报告块'); };
  });
  [].forEach.call(cols.querySelectorAll('[data-copy]'), function(a){
    a.onclick = function(){ toast('已复制「' + a.closest('.vwr-card').querySelector('.vwr-ch span').textContent + '」全文'); };
  });
  [].forEach.call(cols.querySelectorAll('.vwr-thumb'), function(t){
    t.onclick = function(){ var rg = document.getElementById('vwRange'); if (rg) { rg.value = 1; rg.oninput(); } };
  });
  if (VWR_S.mode === 'img') vwrInitSlice();
}

function vwrClose(){ var m = document.getElementById('vwMask'); if (m) m.classList.add('hidden'); }

function openViewer(sid){
  var r = null;
  for (var i = 0; i < QC2.length; i++) if (QC2[i].sid === sid) { r = QC2[i]; break; }
  if (!r) return;
  var m = document.getElementById('vwMask');
  if (!m) {
    m = document.createElement('div');
    m.id = 'vwMask'; m.className = 'vwr-mask hidden';
    m.innerHTML = '<div class="vwr">'
      + '<div class="vwr-top"><div class="vwr-info" id="vwInfo"></div>'
      +   '<div class="vwr-sbox"><input id="vwSearch" readonly>🔍</div></div>'
      + '<div class="vwr-main"><div class="vwr-cols" id="vwCols"></div>'
      +   '<div class="vwr-rail">'
      +     '<a data-mode="img"><span class="ico">👁</span>影像质控</a>'
      +     '<a data-mode="rep"><span class="ico">📄</span>报告质控</a>'
      +   '</div></div>'
      + '<div class="vwr-foot"><span class="c">《免责声明》　《使用须知》</span><span>版本号：v1.0.5</span></div>'
      + '</div>';
    document.body.appendChild(m);
    m.addEventListener('click', function(e){ if (e.target === m) vwrClose(); });
    [].forEach.call(m.querySelectorAll('.vwr-rail a'), function(a){
      a.onclick = function(){
        VWR_S.mode = a.getAttribute('data-mode');
        VWR_S.slice = 0;
        vwrRender();
      };
    });
  }
  VWR_S.sid = sid;
  VWR_S.mode = (String(r.scope || '').indexOf('影像') >= 0) ? 'img' : 'rep';
  VWR_S.slice = 0;
  vwrRender();
  m.classList.remove('hidden');
}

document.addEventListener('click', function(e){
  var a = e.target.closest ? e.target.closest('[data-qcv]') : null;
  if (a) { e.preventDefault(); openViewer(a.getAttribute('data-qcv')); }
});

</script>
<script>
/* ============================================================================
   质控管理：审核 / 查看（报告文书页）
   ============================================================================ */
QC2.forEach(function(r, i){
  if (!r.audit) r.audit = ((i % 5) < 2) ? '已审核' : '未审核';
  if (!r.age)   r.age   = 38 + (i % 40);
});

var AD_ISS = [
  ['口语化与错别字', -10],
  ['诊断内容不规范', -5],
  ['病灶形态描述不规范', -2],
  ['病灶密度描述不规范', -2],
  ['病灶边缘描述不规范', -2],
  ['诊断建议不规范', -2],
  ['格式与符号不规范', -2]
];

var AD_S = { sid:null, mode:'审核', collapsed:false, menu:null };

function adRow(sid){
  for (var i = 0; i < QC2.length; i++) if (QC2[i].sid === sid) return QC2[i];
  return null;
}
function adGrade(r){
  var m = String(r.sys || '').match(/[甲乙丙丁]/);
  return m ? m[0] : '乙';
}
function adScore(r){
  var m = String(r.sys || '').match(/([0-9]+)\s*$/);
  return m ? m[1] : '75';
}
function adText(r){
  var t = (typeof VWR_TXT !== 'undefined') ? VWR_TXT[(r.idx || 0) % VWR_TXT.length] : null;
  if (t) return { see:t.see, dx:t.dx };
  return { see:'胸廓对称。双肺散在小结节，长径约0.2-0.6cm；双肺散在少许斑片及条索影。气管及叶、段支气管未见狭窄、闭塞及扩大。肺门及纵隔淋巴结未见肿大。心脏未见增大，心包未见积液。双侧胸腔未见积液。',
           dx:'双肺散在小结节，多系炎性，请随诊。双肺散在少许慢性炎症，伴轻度间质性改变。' };
}
function adEmptySvg(){
  return '<svg width="128" height="96" viewBox="0 0 128 96" fill="none">'
    + '<rect x="34" y="20" width="60" height="62" rx="4" stroke="#BFD4FF" stroke-width="2"/>'
    + '<rect x="46" y="10" width="36" height="14" rx="3" fill="#EAF1FF" stroke="#BFD4FF" stroke-width="2"/>'
    + '<path d="M46 40h36M46 52h36M46 64h22" stroke="#D6E4FF" stroke-width="2" stroke-linecap="round"/>'
    + '<path d="M96 34l10-8" stroke="#BFD4FF" stroke-width="2" stroke-linecap="round"/>'
    + '<path d="M104 24l4 6-7 1 3-7z" fill="#BFD4FF"/>'
    + '<circle cx="24" cy="70" r="7" stroke="#E3EDFF" stroke-width="2"/>'
    + '<path d="M18 84c2-3 10-3 12 0" stroke="#E3EDFF" stroke-width="2" stroke-linecap="round"/>'
    + '</svg>';
}

function adRender(){
  var r = adRow(AD_S.sid);
  if (!r) return;
  var isView = AD_S.mode === '查看';
  var t = adText(r);
  var g = adGrade(r), sc = adScore(r);

  document.getElementById('adBadge').className = 'ad-badge ' + (isView ? 'done' : 'wait');
  document.getElementById('adBadge').textContent = isView ? '✓ 已审核' : '未审核';
  document.getElementById('adFields').innerHTML =
      '<span><span class="k">姓名：</span>' + esc(r.name) + '</span>'
    + '<span><span class="k">检查号：</span>' + esc(r.sid) + '</span>'
    + '<span><span class="k">性别：</span>' + esc(r.sex) + '</span>'
    + '<span><span class="k">年龄：</span>' + esc(String(r.age)) + '</span>'
    + '<span><span class="k">检查日期：</span>' + esc(r.time) + '</span>';
  document.getElementById('adSee').textContent = t.see;
  document.getElementById('adDx').textContent = t.dx;
  document.getElementById('adGrade').textContent = g;
  document.getElementById('adScore').textContent = sc + '/100';

  var box = document.getElementById('adList');
  if (isView) {
    box.innerHTML = '<div class="ad-empty">' + adEmptySvg() + '<span>暂无内容</span></div>';
  } else {
    box.innerHTML = AD_ISS.map(function(it, i){
      return '<div class="ad-iss" data-i="' + i + '">'
        + '<i class="ad-ai">AI</i><span class="ad-name">' + esc(it[0]) + '</span>'
        + '<span class="ad-sep">|</span><span class="ad-pin">📍 1</span><span class="sp"></span>'
        + '<span class="ad-minus">' + it[1] + '</span>'
        + '<span class="ad-more" data-more="' + i + '">更多 ▾</span>'
        + '<span class="ad-x" data-x="' + i + '">×</span></div>';
    }).join('');
    adBindList();
  }
  document.getElementById('adSubmit').classList.toggle('disabled', isView);
}

function adBindList(){
  var box = document.getElementById('adList');
  [].forEach.call(box.querySelectorAll('[data-x]'), function(x){
    x.onclick = function(){
      var row = x.closest('.ad-iss');
      row.style.display = 'none';
      toast('已忽略该质控项');
    };
  });
  [].forEach.call(box.querySelectorAll('[data-more]'), function(m){
    m.onclick = function(e){
      e.stopPropagation();
      var old = document.querySelector('.ad-menu'); if (old) old.remove();
      var d = document.createElement('div');
      d.className = 'ad-menu';
      d.innerHTML = '<div data-act="定位">定位原文</div><div data-act="忽略">忽略此项</div><div data-act="复制">复制描述</div>';
      var rc = m.getBoundingClientRect();
      d.style.position = 'fixed';
      d.style.left = Math.max(8, rc.left - 80) + 'px';
      d.style.top = (rc.bottom + 4) + 'px';
      document.body.appendChild(d);
      [].forEach.call(d.querySelectorAll('div'), function(it){
        it.onclick = function(){
          var a = it.getAttribute('data-act');
          d.remove();
          if (a === '忽略') { var row = m.closest('.ad-iss'); if (row) row.style.display = 'none'; toast('已忽略该质控项'); }
          else toast(a === '定位' ? '已定位到原文位置' : '已复制问题描述');
        };
      });
      setTimeout(function(){
        document.addEventListener('click', function close(){ var o = document.querySelector('.ad-menu'); if (o) o.remove(); document.removeEventListener('click', close); });
      }, 0);
    };
  });
}

function adStep(dir){
  var V = QM_VIEW;
  var rows = qc2Filtered(QM_F, QM_COLS);
  var idx = -1;
  for (var i = 0; i < rows.length; i++) if (rows[i].sid === AD_S.sid) { idx = i; break; }
  if (idx < 0) return;
  var n = idx + dir;
  if (n < 0 || n >= rows.length) { toast(dir < 0 ? '已经是第一条' : '已经是最后一条'); return; }
  var r = rows[n];
  AD_S.sid = r.sid;
  AD_S.mode = (r.audit === '已审核') ? '查看' : (QM_F.audit === '已审核' ? '查看' : '审核');
  adRender();
}

function adClose(){ var m = document.getElementById('adMask'); if (m) m.classList.add('hidden'); }

function openAudit(sid, mode){
  var r = adRow(sid);
  if (!r) return;
  var m = document.getElementById('adMask');
  if (!m) {
    m = document.createElement('div');
    m.id = 'adMask'; m.className = 'ad-mask hidden';
    m.innerHTML = ''
    + '<div class="ad">'
    +   '<div class="ad-top"><a class="ad-back" id="adBack">← 返回</a>'
    +     '<span class="ad-warn"><i>!</i>提交后将无法进行编辑操作</span></div>'
    +   '<div class="ad-pat"><div class="ad-pinfo">'
    +     '<div class="ad-pt"><span>患者信息</span><span class="ad-badge wait" id="adBadge">未审核</span></div>'
    +     '<div class="ad-fields" id="adFields"></div></div>'
    +     '<div class="ad-acts"><label><input type="checkbox" id="adAuto">切换患者时自动保存</label>'
    +       '<button class="ad-btn ghost" id="adPrev">&lt; 前一个</button>'
    +       '<button class="ad-btn ghost" id="adNext">后一个 &gt;</button>'
    +       '<button class="ad-btn" id="adSave">保存</button>'
    +       '<button class="ad-btn pri" id="adSubmit">提交</button>'
    +       '<button class="ad-btn" id="adReset">重置</button></div></div>'
    +   '<div class="ad-body">'
    +     '<div class="ad-left">'
    +       '<div class="ad-lt"><b>报告文书</b><button class="ad-btn pri">+ 新增</button>'
    +         '<button class="ad-btn pri">✎ 编辑</button><span class="sp"></span>'
    +         '<span class="mode">展示模式：单屏-纯文本 ▾</span></div>'
    +       '<div class="ad-blk"><div class="ad-bh"><span>影像所见-原始报告</span>'
    +         '<label><input type="checkbox">标注总览</label></div><div class="ad-txt" id="adSee"></div></div>'
    +       '<div class="ad-blk"><div class="ad-bh"><span>影像诊断-原始报告</span></div>'
    +         '<div class="ad-txt" id="adDx"></div></div>'
    +     '</div>'
    +     '<div class="ad-right">'
    +       '<div class="ad-rt"><b>报告质控结果</b><em class="ad-grade" id="adGrade">乙</em>'
    +         '<span class="ad-score" id="adScore">75/100</span><span class="sp"></span>'
    +         '<a id="adExpand">展开</a><a id="adCollapse">收起</a></div>'
    +       '<div class="ad-list" id="adList"></div>'
    +     '</div>'
    +   '</div>'
    + '</div>';
    document.body.appendChild(m);
    m.addEventListener('click', function(e){ if (e.target === m) adClose(); });
    document.getElementById('adBack').onclick = adClose;
    document.getElementById('adPrev').onclick = function(){ adStep(-1); };
    document.getElementById('adNext').onclick = function(){ adStep(1); };
    document.getElementById('adSave').onclick = function(){ toast('已保存当前质控记录：' + AD_S.sid); };
    document.getElementById('adReset').onclick = function(){
      var rr = adRow(AD_S.sid);
      AD_S.collapsed = false;
      adRender();
      toast('已重置为系统质控结果');
    };
    document.getElementById('adSubmit').onclick = function(){
      var rr = adRow(AD_S.sid);
      if (!rr) return;
      if (rr.audit === '已审核') { toast('该记录已审核，无需重复提交'); return; }
      rr.audit = '已审核';
      rr.tmp = rr.sys;
      adClose();
      renderQm();
      toast('提交成功，已写入审核结果：' + rr.sid);
    };
    document.getElementById('adExpand').onclick = function(){
      var st = document.querySelectorAll('#adList .ad-iss');
      [].forEach.call(st, function(x){ x.style.display = ''; });
      toast('已展开全部质控项');
    };
    document.getElementById('adCollapse').onclick = function(){
      var st = document.querySelectorAll('#adList .ad-iss');
      if (!st.length) { toast('暂无可收起的质控项'); return; }
      [].forEach.call(st, function(x, i){ x.style.display = i === 0 ? '' : 'none'; });
      toast('已收起，仅保留首条');
    };
  }
  AD_S.sid = sid;
  AD_S.mode = mode || (r.audit === '已审核' ? '查看' : '审核');
  adRender();
  m.classList.remove('hidden');
}

document.addEventListener('click', function(e){
  var a = e.target.closest ? e.target.closest('[data-qma]') : null;
  if (a) { e.preventDefault(); openAudit(a.getAttribute('data-qma'), a.getAttribute('data-mode')); }
});

</script>
</body>
</html>
